name: CI Testing

on: [push, pull_request]

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-18.04, windows-2019, macOS-10.15]
        python-version: [3.6, 3.7]
        pytorch-version: [1.1, 1.4, 'nightly']
        exclude:
          - os: macOS-10.15
            pytorch-version: 1.1

    steps:
    - uses: actions/checkout@v1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v1
      with:
        python-version: ${{ matrix.python-version }}
    - name: Setup conda
      run: |
        wget https://repo.continuum.io/miniconda/Miniconda3-latest-Linux-x86_64.sh -O miniconda.sh;
        bash miniconda.sh -b -p $HOME/miniconda
        export PATH="$HOME/miniconda/bin:$PATH"
        hash -r
        conda config --set always_yes yes --set changeps1 no
        conda update -q conda
        conda info -a
        conda create -q -n test-environment python=${{ matrix.python-version }}
        source activate test-environment
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install scipy
    - name: Install Pytorch 1.1
      if: matrix.pytorch-version == 1.1
      run: |
        conda install pytorch-cpu==1.1.0 torchvision-cpu==0.3.0 cpuonly -c pytorch
    - name: Install Pytorch 1.4
      if: matrix.pytorch-version == 1.4
      run: |
        conda install pytorch torchvision cpuonly -c pytorch
    - name: Install Pytorch Nightly
      if: matrix.pytorch-version == 'nightly'
      run: |
        conda install pytorch torchvision cpuonly -c pytorch-nightly
    - name: Lint with flake8
      run: |
        pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=79 --statistics
    - name: Test with pytest
      run: |
        pip install pytest
        pytest
